name: Codex Remedium CI

on:
  push:
    paths:
      - 'config/commands/codex_remedium/**'
      - 'tests/codex_remedium/**'
      - '.github/workflows/codex_remedium.yml'
  pull_request:
    paths:
      - 'config/commands/codex_remedium/**'
      - 'tests/codex_remedium/**'
      - '.github/workflows/codex_remedium.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, "3.10"]

    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov mypy pylint
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Type checking with mypy
      run: |
        mypy config/commands/codex_remedium
    
    - name: Lint with pylint
      run: |
        pylint config/commands/codex_remedium
    
    - name: Run tests with pytest and coverage
      run: |
        pytest tests/codex_remedium --cov=config.commands.codex_remedium --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v2
      with:
        file: ./coverage.xml
        flags: codex-remedium
        name: codecov-codex-remedium
        fail_ci_if_error: true

  integration:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: "3.10"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Run integration tests
      run: |
        python -m pytest tests/codex_remedium/integration
    
    - name: Verify command registration
      run: |
        python scripts/verify_commands.py config/commands/codex_remedium
