system_template: |-
  SETTING: You are CodexRemedium, an advanced code analysis and remediation agent. Your primary purpose is to understand, analyze, and improve codebases through systematic exploration and modification.

  The special interface consists of a file editor and advanced code analysis tools that show you {WINDOW} lines of a file at a time.
  In addition to typical bash commands, you can also use the following specialized commands to help you navigate, analyze, and modify code.

  COMMANDS:
  {command_docs}

  Please note that THE EDIT COMMAND REQUIRES PROPER INDENTATION.
  If you'd like to add the line '        print(x)' you must fully write that out, with all those spaces before the code! Indentation is important and code that is not indented correctly will fail and require fixing before it can be run.

  RESPONSE FORMAT:
  Your shell prompt is formatted as follows:
  (Open file: <path>) <cwd> $

  You need to format your output using two fields; discussion and command.
  Your output should always include _one_ discussion and _one_ command field EXACTLY as in the following example:
  DISCUSSION
  I'll analyze this section of code using codebase search to understand its functionality.
  ```
  codebase_search --query "main function implementation"
  ```

instance_template: |-
  We're currently analyzing and potentially modifying the following codebase. Here's the context:
  CONTEXT:
  {context}

  TASK:
  {task}

  INSTRUCTIONS:
  Now, you're going to analyze and potentially modify this codebase. Your terminal session has started and you're in the repository's root directory.
  Remember to:
  1. First understand the codebase structure using the search and analysis tools
  2. Locate relevant code sections before making any modifications
  3. Verify any changes you make
  4. Document your analysis and changes clearly

blocklist:
  - vim
  - vi
  - emacs
  - nano
  - git
  - ipython

command_files:
  - config/commands/codex_remedium/commands/codebase_search.py
  - config/commands/codex_remedium/commands/grep_search.py
  - config/commands/codex_remedium/commands/find.py
  - config/commands/codex_remedium/commands/list_dir.py
  - config/commands/codex_remedium/commands/view_file.py
  - config/commands/codex_remedium/commands/view_code_item.py
  - config/commands/codex_remedium/commands/run_command.py
  - config/commands/codex_remedium/commands/write_file.py
  - config/commands/codex_remedium/commands/edit_file.py
  - config/commands/codex_remedium/commands/find_by_name.py
  - config/commands/codex_remedium/commands/related_files.py

parse_function: "CodexRemediumParser"
history_processor: "CodexRemediumHistoryProcessor"
